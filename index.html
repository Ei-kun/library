<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="icon header-icon first-row"><img alt="book icon" src="images/book.svg"></div>
        <div class="sub">
            <div class="icon"><img alt="home icon" src="images/home.svg"></div>
            <div class="icon"><img alt="dashboard icon" src="images/dashboard.svg"></div>
            <div class="icon"><img alt="settings icon" src="images/settings.svg"></div>
            <div class="icon"><img alt="help icon" src="images/help.svg"></div>
        </div>
        <div class="icon footer-icon"><img alt="sign out icon" src="images/exit.svg"></div>
    </div>
    <div class="searchbar first-row">
        <div class="wrapper search">
            <input type="search" placeholder="Search…" class="input" />
        </div>
    </div>
    <div class="profile first-row">
        <div class="icon"><img alt="notifications" src="images/notifications.svg"></div>
        <div class="pfp"><img alt="profile picture" src="images/pfp.jpg"></div>
        <div>Ei-kun</div>
    </div>
    <div class="quote">
        <button class="quoteHeader">Quote Today</button>
        <div class="content">"People do not decide their future, they decide their habits and their habits decide their future."</div>
        <div class="attribution">- F.M. Alexander</div>
    </div>
    <div class="input">input</div>
    <div class="books">books</div>
    <div class="ad">ad</div>
    <div class="statistics">statistics</div>
    <div class="email">email</div>
</body>
</html>
