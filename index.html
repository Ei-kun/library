<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <div class="icon header-icon first-row"><img alt="book icon" src="images/book.svg"></div>
        <div class="sub">
            <div class="icon"><img alt="home icon" src="images/home.svg"></div>
            <div class="icon"><img alt="dashboard icon" src="images/dashboard.svg"></div>
            <div class="icon"><img alt="settings icon" src="images/settings.svg"></div>
            <div class="icon"><img alt="help icon" src="images/help.svg"></div>
        </div>
        <div class="icon footer-icon"><img alt="sign out icon" src="images/exit.svg"></div>
    </div>
    <div class="searchbar first-row">
        <div class="wrapper search">
            <input type="search" placeholder="Search…" class="input" />
        </div>
    </div>
    <div class="profile first-row">
        <div class="icon"><img alt="notifications" src="images/notifications.svg"></div>
        <a href="https://github.com/Ei-kun" title="Ei-kun" class="pfp"><img alt="profile picture" src="images/pfp.jpg"></a>
    </div>
    <div class="quote">
        <button class="quoteHeader">Quote Today</button>
        <div class="content">"A reader lives a thousand lives before he dies… The man who never reads lives only one."</div>
        <div class="attribution">- George R.R. Martin</div>
    </div>
    <div class="add-book">
        <img alt="Book image" src="images/book-input.png">
        <div class="message"><strong>Did you know?</strong> Reading regularly can reduce stress by up to 68%. Add a book to your collection today!</div>
        <button class="add-button">Add Book</button>
    </div>
    <div class="books">
        <div class="collection-header">Continue Reading</div>
        <div class="collection">
            <div class="book">
                <img alt="Book 1" src="images/gatsby.jpg">
                <div class="outer-bar">
                    <div class="inner-bar"></div>
                </div>
            </div>
            <div class="book">
                <img alt="Book 1" src="images/potter.jpg">
                <div class="outer-bar">
                    <div class="inner-bar"></div>
                </div>
            </div>
            <div class="book">
                <img alt="Book 1" src="images/truly-madly.jpg">
                <div class="outer-bar">
                    <div class="inner-bar"></div>
                </div>
            </div>
            <div class="book">
                <img alt="Book 1" src="images/just-friends.jpg">
                <div class="outer-bar">
                    <div class="inner-bar"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="ad">
        <div class="message">See the source code on <strong>Github!</strong></div>
        <a href="https://github.com/Ei-kun/library"><button>GO</button></a>
    </div>
    <div class="statistics">
        <div class="section">
            <div class="icon-circle read"><img alt="read books" src="images/stats-1.svg"></div>
            <div class="section-stats">
                <div class="amount">2</div>
                <div class="type">Read Books</div>
            </div>
        </div>
        <div class="section">
            <div class="icon-circle authors"><img alt="authors" src="images/stats-2.svg"></div>
            <div class="section-stats">
                <div class="amount">4</div>
                <div class="type">Authors</div>
            </div>
        </div>
        <div class="section">
            <div class="icon-circle reading"><img alt="reading books" src="images/stats-3.svg"></div>
            <div class="section-stats">
                <div class="amount">3</div>
                <div class="type">Reading</div>
            </div>
        </div>
    </div>
    <div class="email">
        <input type="email" placeholder="Subscribe to Our Blog" class="email-input">
        <button><img src="images/email.svg" alt="email"></button>
    </div>
</body>
</html>
